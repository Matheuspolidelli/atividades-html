<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta: name="description" content="Conteudo sobre o uso de aplicacao 
    de iframes em HTML">
    <title>Sobre iframes html</title>
</head>
<body>
    <h1> Oque é um Iframe?</h1>
    <p>Um iframe <strong>(inline frame)</strong></p>
        
    <p> é um elemento HTML que permite incorporar 
        outro documento HTML dentro da página atual.</p>

        <hr>
        <h2>Criando um Iframe basico</h2>
       <iframe src="03-listas.html" frameborder="0" width="600" height="700"></iframe>
       
    <hr>
    <h2> explorando outras formas de iframes</h2>
    <h3>incorporando o youtube</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/BdVXJ2f5bXQ?si=SHhpvkkWf0rL1TRR" title="YouTube video player" frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="
    strict-origin-when-cross-origin" allowfullscreen></iframe>

    <hr>
    <h3>Incorporando o google maps</h3>
    <iframe  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3657.753441574946!2d-46.56368462977873!3d-23.541368791800654!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1790213236155!5m2!1spt-BR!2sbr" 
    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    
</body>
</html>
